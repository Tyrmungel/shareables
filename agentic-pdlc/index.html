# Stage 1 case file — Candidate 4: Heat-pump-as-a-service bundle

**Current stage:** 1 — Opportunity framing (fully analyzed; not proceeding — see gate proposal)
**Owner:** Jüri Tomingas (homework run — standing in as named business approver, per `../scope.md`)

## Problem statement

"Owners of older, non-heat-pump-heated Estonian homes struggle to switch to cheaper heating because the €7,000-10,000+ upfront cost is a barrier even with the KredEx subsidy; today they stay on their existing (often more expensive) heating system." (H4.1)

## Segment

Estonian households heating with an older, more expensive system (not district heating, not already a heat pump) — explicitly the retrofit segment, not new construction, since new-build housing already adopts heat pumps at a high rate on its own (E11) and doesn't need Enefit's help to do so.

## Why this looked promising, and why it's narrower than it first appears

Heat pumps are priced from €7,467 + VAT before installation (E9), and one retailer alone claims over 3,500 customers a year (E10) — real, sizeable demand exists. But roughly 60% of new-build Estonian houses already choose a heat pump (E11), meaning the segment where a bundled offer would actually change a decision is the *retrofit* segment specifically — a smaller, harder-to-reach population than "everyone who might want a heat pump."

## Strategic fit test result

| Question | Answer | Evidence |
| --- | --- | --- |
| Strategic priority | Unclear — plausible fit with electrification-of-heating and energy-transition priorities, but no internal brief confirms it. Logged as hypothesis H4.3. | — |
| Right to win | **Fail** — no evidence of any Enefit installer relationship, heat-pump financing product, or partner capability. Unlike Candidate 3, which at least has Enefit's existing small-producer/net-metering package (E5) and the group's own storage/renewables assets (E16) to build from, this candidate has no comparable foothold — "no advantage over rivals that we can name and prove" applies directly. | E9, E10 |
| Capability and risk | Not formally reached given the Fail above, but also worth recording on its own: a working installer network is a critical missing capability with no evidenced build or partner path, which independently matches this question's own fail signal. | — |

**Result: Fails strategic fit on right-to-win (independently reinforced by capability/risk).**

## Sizing (produced anyway, per this run's instruction to fully analyze every opportunity)

| Input | Value used | Basis |
| --- | --- | --- |
| Candidate retrofit homes reachable per year | 300 (conservative) / 600 (base) / 1,200 (optimistic) | **Assumption** — one retailer alone (Bestair) already claims 3,500 heat pump customers/year market-wide (E10); this range assumes an Enefit-branded financed offer captures a modest slice of that market, not that it creates new market size. |
| Net contribution margin per customer per year (financed-hardware-as-a-service) | €250 (conservative) / €400 (base) / €700 (optimistic) | **Assumption** — no Enefit or market subscription-pricing data found for this category. |

**Sized prize (conservative / base / optimistic):**

- Conservative: 300 × €250 = **€75,000/year** — misses the minimum prize by a wide margin.
- Base: 600 × €400 = **€240,000/year** — misses the minimum prize.
- Optimistic: 1,200 × €700 = **€840,000/year** — clears the minimum prize.

Base case misses the €500,000/year minimum prize by more than half; this is the weakest base case of the three "hardware-adjacent" candidates (3, 4).

## Indirect value

Heating electrification is one of the few candidates here that plausibly *increases* Enefit's core electricity consumption revenue per household (a heat pump runs on electricity, typically replacing oil, gas or district heat) rather than reducing it. This is a real, distinctive upside worth naming even though the candidate is being parked — logged as hypothesis H4.4 in case a financing/installer partner surfaces later and this gets revisited.

## Cannibalization check

Unlike Candidate 3 (solar/storage), this candidate does **not** cannibalize Enefit's own electricity sales — if anything, converting a household from oil/gas/district heat to a heat pump adds grid electricity consumption. The cannibalization risk here, if any, is against Enefit's own gas business (if it sells gas to any of these households) rather than against its electricity packages. This is a genuinely favorable structural difference from Candidate 3, even though the candidate is not proceeding on right-to-win grounds.

## Hypotheses raised

| ID | Type | Statement | Risk (1-5) | Uncertainty (1-5) | Status | Evidence |
| --- | --- | --- | --- | --- | --- | --- |
| H4.1 | Desirability | We believe retrofit homeowners are blocked mainly by upfront cost, not by lack of interest in cheaper heating. | 4 | 4 | Untested | E9, E10, E11 |
| H4.2 | Viability | We believe the retrofit segment (excluding new construction, which already self-solves) is large enough on its own to matter at Enefit's scale. | 3 | 4 | Untested | E11 |
| H4.3 | Strategic | We believe this fits an electrification-of-heating priority, but no internal brief confirms it. | 3 | 5 | Untested (unclear at strategic fit) | — |
| H4.4 | Feasibility | We believe an installer or financing partner could be secured, which would be the single input that could flip the right-to-win Fail above. | 5 | 5 | Untested — the input that would need to change to revisit this candidate | — |

## Gate proposal (this candidate individually)

**Kill.** Fails strategic fit on right-to-win — no evidenced installer or financing capability, and (unlike Candidate 3) no existing Enefit infrastructure to build from — and the economics are also the weakest of the candidates sized in this run, missing the minimum prize in both the conservative and base cases. The favorable cannibalization profile (H4.4's upside, adding electricity consumption rather than reducing it) is real but not enough on its own to outweigh the missing right-to-win and the weak base case. Not carried to Stage 2, but flagged as revisitable if an installer/financing partner surfaces.

# Stage 1 case file — Candidate 5: EV home-charging + electricity bundle

**Current stage:** 1 — Opportunity framing (fully analyzed; not proceeding — see gate proposal)
**Owner:** Jüri Tomingas (homework run — standing in as named business approver, per `../scope.md`)

## Problem statement

Working statement, deliberately weaker than the others because the evidence for a real, blocked job is thin: "Estonian EV-owning households might get more value from a bundled home-charging + electricity tariff than from treating charging as undifferentiated home electricity use — but no evidence surfaced of an actual friction they experience today." This candidate is included for completeness because the earlier (deleted) pass had raised an EV-related candidate, and it deserves fresh, honest re-scoring rather than being carried forward on the old framing.

## Segment

Estonian EV-owning households who are already Enefit electricity customers.

## Why this looked promising, and why it's weaker on inspection

Estonia's EV fleet passed 10,000 units and Q1 2026 sales were up 16.1% YoY (E7) — real, if small, growth. But that headline needs care: BEV market *share* actually fell (10.6% → 6.1%) purely because the total car market grew +100.4% YoY on a 2025 car-tax distortion, not because EV interest declined (E7). Separately, Ignitis already unified its EV fast-charging app (Ignitis ON) across all three Baltic states from January 2026 (E12) — but that is a public-charging-network business, not a home-bundle, so it is a partial rather than direct competitive signal for this specific candidate.

## Strategic fit test result

| Question | Answer | Evidence |
| --- | --- | --- |
| Strategic priority | Unclear — plausible fit with a transport-electrification priority, but no internal brief confirms it. Logged as hypothesis H5.2. | — |
| Right to win | **Pass, conditionally** — Enefit already has the billing relationship with EV-owning customers in its own base; Ignitis's move (E12) is in public charging infrastructure, a different business from a home-bundle tariff, so no direct rival can be named specifically against *this* angle. | E12 |
| Capability and risk | **Pass** — no new hardware needed from Enefit itself (the charger is the customer's own or a partner's); this is a tariff/app feature, low legal risk. | — |

**Result: Passes strategic fit (2 Pass, 1 Unclear) — but killed on prize size regardless. See sizing.**

## Sizing

| Input | Value used | Basis |
| --- | --- | --- |
| EV-owning households already in Enefit's own customer base | 3,000 (conservative) / 4,500 (base) / 6,000 (optimistic) | **Assumption** — Estonia's total EV fleet is just over 10,000 (E7); this assumes Enefit, as one of the largest suppliers, already serves a meaningful minority of them, bracketed rather than sourced. |
| Adoption of a bundled EV+electricity tariff among those households | 20% (conservative) / 35% (base) / 50% (optimistic) | **Assumption** — set higher than other candidates' adoption rates since this is a low-friction attach to an existing customer relationship, not a new purchase decision. |
| Value per adopting customer per year | €20 (conservative) / €40 (base) / €70 (optimistic) | **Assumption** — small tariff/app fee or managed-charging margin uplift; no market data found. |

**Sized prize (conservative / base / optimistic):**

- Conservative: 3,000 × 20% × €20 = **€12,000/year**
- Base: 4,500 × 35% × €40 = **€63,000/year**
- Optimistic: 6,000 × 50% × €70 = **€210,000/year**

**All three cases miss the €500,000/year minimum prize, including the optimistic case.** Per the playbook's own Stage 1 gate rule — "Kill if even the optimistic case misses the minimum" — this is a clean kill on the numbers alone, independent of the strategic fit result.

## Indirect value

Possible marginal retention value from a "stickier" EV-owner relationship, but at this population size (a few thousand households) it would not move the needle at Enefit's scale even if fully credited. Not sized separately given the base prize is already far below the bar.

## Cannibalization check

Favorable and simple: EV home charging is incremental electricity consumption, not a substitute for anything Enefit already sells, so this candidate would add to (not cannibalize) existing electricity revenue if it worked. The problem is not cannibalization — it's that the addressable population is too small today for the prize to matter at Enefit's scale.

## Hypotheses raised

| ID | Type | Statement | Risk (1-5) | Uncertainty (1-5) | Status | Evidence |
| --- | --- | --- | --- | --- | --- | --- |
| H5.1 | Desirability | We believe EV-owning households would value a bundled home-charging tariff over treating charging as undifferentiated consumption, though no direct evidence of this friction surfaced. | 3 | 5 | Untested — weakest-evidenced desirability hypothesis of the five candidates | E7 |
| H5.2 | Strategic | We believe this fits a transport-electrification priority, but no internal brief confirms it. | 2 | 5 | Untested (unclear at strategic fit) | — |
| H5.3 | Viability | We believe Enefit's EV-owning customer count will grow enough over the next few years that this candidate's prize could eventually clear the minimum, even though it does not today. | 3 | 5 | Untested — revisit if EV fleet growth accelerates past what E7 shows | E7 |

## Gate proposal (this candidate individually)

**Kill.** Even though this candidate actually passes the strategic fit test better than Candidates 2 and 4 (no right-to-win Fail — Enefit's existing billing relationship is a real asset here, and there's no hardware or installer dependency), the prize itself is too small at today's EV adoption level: even the optimistic case (€210,000/year) misses the €500,000/year minimum prize, which the playbook's own gate rule treats as an unconditional kill. Worth logging H5.3 for a future Stage 1 pass if Estonia's EV fleet grows enough to change this, but not carried to Stage 2 now.

function App() {
  const [candidate, setCandidate] = useState('A');
  const [revealed, setRevealed] = useState({});
  const [scrollPct, setScrollPct] = useState(0);
  const [heroIn, setHeroIn] = useState(false);
  const [modalStage, setModalStage] = useState(null);
  const [modalVisible, setModalVisible] = useState(false);
  const modalTimer = useRef(null);
  const modalCardRef = useRef(null);
  const modalLastFocusRef = useRef(null);
  const [docN, setDocN] = useState(null);
  const [docVisible, setDocVisible] = useState(false);
  const docTimer = useRef(null);
  const docBodyRef = useRef(null);
  const docCardRef = useRef(null);
  const docLastFocusRef = useRef(null);

  useEffect(() => {
    const observed = new Set();
    const io = new IntersectionObserver((entries) => {
      entries.forEach((e) => {
        if (e.isIntersecting) {
          const id = e.target.getAttribute('data-reveal-id');
          setRevealed((s) => (s[id] ? s : { ...s, [id]: true }));
          io.unobserve(e.target);
        }
      });
    }, { threshold: 0.1, rootMargin: '0px 0px -40px 0px' });
    const scan = () => {
      document.querySelectorAll('[data-reveal-id]').forEach((el) => {
        if (!observed.has(el)) { observed.add(el); io.observe(el); }
      });
    };
    scan();
    const scanInterval = setInterval(scan, 400);
    const fallbackInterval = setInterval(() => {
      const now = Date.now();
      observed.forEach((el) => {
        const id = el.getAttribute('data-reveal-id');
        if (!el._revealSeenAt) el._revealSeenAt = now;
        setRevealed((s) => {
          if (s[id]) return s;
          if (now - el._revealSeenAt > 3000) {
            const rect = el.getBoundingClientRect();
            if (rect.top < window.innerHeight && rect.bottom > 0) return { ...s, [id]: true };
          }
          return s;
        });
      });
    }, 1000);
    const onScroll = () => {
      const h = document.documentElement.scrollHeight - window.innerHeight;
      setScrollPct(h > 0 ? Math.min(100, Math.max(0, (window.scrollY / h) * 100)) : 0);
    };
    window.addEventListener('scroll', onScroll, { passive: true });
    onScroll();
    const heroTimer = setTimeout(() => setHeroIn(true), 100);
    const onKeyDown = (e) => {
      if (modalStage === null) return;
      if (e.key === 'Escape') { closeModal(); return; }
      if (e.key === 'Tab' && modalCardRef.current) {
        const focusable = modalCardRef.current.querySelectorAll('button, a[href], [tabindex]:not([tabindex="-1"])');
        if (!focusable.length) return;
        const first = focusable[0];
        const last = focusable[focusable.length - 1];
        if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
        else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
      }
    };
    window.addEventListener('keydown', onKeyDown);
    return () => {
      io.disconnect();
      window.removeEventListener('scroll', onScroll);
      window.removeEventListener('keydown', onKeyDown);
      clearInterval(scanInterval);
      clearInterval(fallbackInterval);
      clearTimeout(heroTimer);
      clearTimeout(modalTimer.current);
    };
  }, [modalStage]);

  function openModal(n) {
    modalLastFocusRef.current = document.activeElement;
    setModalStage(n);
    setModalVisible(false);
    modalTimer.current = setTimeout(() => setModalVisible(true), 20);
  }
  function closeModal() {
    setModalVisible(false);
    modalTimer.current = setTimeout(() => {
      setModalStage(null);
      if (modalLastFocusRef.current) modalLastFocusRef.current.focus();
    }, 200);
  }
  function openDoc(n) {
    docLastFocusRef.current = document.activeElement;
    setDocN(n);
    setDocVisible(false);
    docTimer.current = setTimeout(() => setDocVisible(true), 20);
  }
  function closeDoc() {
    setDocVisible(false);
    docTimer.current = setTimeout(() => {
      setDocN(null);
      if (docLastFocusRef.current) docLastFocusRef.current.focus();
    }, 200);
  }
  useEffect(() => {
    if (modalVisible && modalCardRef.current) modalCardRef.current.focus();
  }, [modalVisible]);
  useEffect(() => {
    if (docVisible && docCardRef.current) docCardRef.current.focus();
  }, [docVisible]);
  useEffect(() => {
    if (!docN) return;
    const h = (e) => {
      if (e.key === 'Escape') { closeDoc(); return; }
      if (e.key === 'Tab' && docCardRef.current) {
        const focusable = docCardRef.current.querySelectorAll('button, a[href], [tabindex]:not([tabindex="-1"])');
        if (!focusable.length) return;
        const first = focusable[0];
        const last = focusable[focusable.length - 1];
        if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
        else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
      }
    };
    window.addEventListener('keydown', h);
    return () => window.removeEventListener('keydown', h);
  }, [docN]);
  const docHtml = useMemo(() => {
    if (!docN) return '';

              <button onClick={closeDoc} className="close-btn" aria-label="Close" style={{ background: 'oklch(96% 0.006 255)', border: 'none', width: '30px', height: '30px', borderRadius: '50%', fontSize: '16px', cursor: 'pointer', flexShrink: 0 }}>✕</button>
            </div>
            <div ref={docBodyRef} className="md-body" style={{ padding: '22px 30px 30px', overflowY: 'auto', flex: '1 1 auto', minHeight: 0 }} dangerouslySetInnerHTML={{ __html: docHtml }} />
          </div>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
