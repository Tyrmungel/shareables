# PM Playbook

2026-09-20

## Purpose and stage map

This playbook takes a new product or service offering from raw opportunity to a launch, scale or kill decision in eight stages, and every stage ends with a written gate decision. A person or an AI agent can run any stage from its inputs to its outputs. Stages 1-5 are specified in full; stages 6-8 are lighter.

| Stage | Question the gate answers | Wall-clock duration | What that time is actually waiting on | Evidence required to pass |
| --- | --- | --- | --- | --- |
| 1. Opportunity framing | Is this worth a discovery budget? | Ongoing scan; 1-3 days to size once a candidate is flagged | Signal-gathering runs continuously in the background; the 1-3 days is only the approver signing the minimum prize and discovery budget for a flagged candidate | Sized prize as a range, strategic fit, one-line problem |
| 2. Problem discovery | Is the problem real, frequent and reachable? | 1-2 weeks | Recruiting and actually conducting 8-12 real interviews | 8-12 interviews plus behavioral data |
| 3. Hypothesis map | Which assumptions could kill this, and what proof would we accept? | 2-5 business days | Turnaround from five function reviewers (legal, ops, IT, pricing, finance) | Ranked register with kill thresholds |
| 4. Cheap tests | Do people act, not just say they like it? | Days to 2 weeks, by test type | Real traffic or usage accumulating for long enough to read (a fake door can read in days with paid traffic; a concierge retention read needs sustained real usage, not just visits) | Behavioral signals against thresholds |
| 5. Pilot | Does it hold up economically and operationally with real customers? | 8-12 weeks | Must span a full billing cycle and any seasonal effect that matters — not compressible by working faster | 100-500 customers, unit economics |
| 6. Launch readiness | Is every function ready to run it? | 2-6 weeks | Cross-functional sign-off turnaround across many owners, not the checklist drafting | Cross-functional sign-off |
| 7. Staged rollout | Does it hold as volume ramps? | 4-12 weeks | Each cohort must be held for a set period to prove guardrails hold before the next ramp — not compressible | Guardrail metrics stay in range |
| 8. Scale, review, sunset | Scale, fix or stop? | Reviews at 30/90/180 days | Fixed by definition — real outcomes need real elapsed time to show up | Results against the original hypotheses |

Durations are starting points to adjust per case, not benchmarks. They are also wall-clock time, not agent effort: drafting, scoring, sizing, coding transcripts, building test assets and writing every artifact in this playbook is agent work measured in hours, at every stage, in an AI-first setup. None of that is what the durations above are timing. What they time is whichever of these an agent's speed cannot shrink: a human approving something, real people's calendars (interviews, reviewer sign-off), real behavior accumulating (traffic, sustained usage), or a real-world cycle (a billing period, a held cohort, a fixed review date). Money can sometimes buy down the second one (more paid traffic reads faster) and approval speed depends on the org, but the others are calendar-bound regardless of how fast the analysis behind them runs.

**Handovers between stages.** Each arrow is a handover. The end of every stage lists exactly what it passes on.

```mermaid
flowchart TD
S1["1. Opportunity framing"] -->|"Case file, seed hypotheses"| S2["2. Problem discovery"]
S2 -->|"Job statement, coded evidence"| S3["3. Hypothesis map"]
S3 -->|"Ranked register, signed thresholds"| S4["4. Cheap tests"]
S4 -->|"Statuses, economics model, price"| S5["5. Pilot"]
S5 -->|"Pilot report, terms, guardrails"| S6["6-8. Launch to review"]
```

Four rules apply at every stage:

- **Evidence grows with spend.** The more money at stake in the next stage, the stronger the proof needed to enter it.
- **Kill thresholds come first.** Write what result would stop the idea before running any test, never after.
- **Riskiest assumption first.** Test what would kill the idea, not what is easiest to test.
- **Behavior over opinion.** Count what people do (click, sign up, pay, stay), not what they say they would do.

## Shared conventions and agent contract

Every stage reads from and writes to the same four artifacts, so any stage can be resumed by a person or an agent with no chat history.

| Artifact | What it holds | Fields |
| --- | --- | --- |
| Case file | One page per opportunity | Problem statement, segment, sized prize range, current stage, owner |
| Evidence log | One row per piece of evidence | ID, date, source (URL, file or interview ID), type (data, interview, test, desk), claim in one sentence, confidence (H/M/L), linked hypothesis IDs |
| Hypothesis register | One row per assumption | ID, type (desirability, viability, feasibility, legal), statement, risk (1-5), uncertainty (1-5), metric, kill threshold, test, status (untested, supported, refuted, inconclusive), evidence IDs |
| Gate decision record | One per stage exit | Stage, date, proposed decision (go, pivot, kill, hold), three reasons, evidence IDs, open risks, approver, budget released |

**Hypothesis statement format:** "We believe [segment] will [behavior] because [reason]. We will know we are right when [metric] reaches [threshold] within [time]."

**Storage convention, when tracked as files.** The playbook itself is one fixed file (for example `playbook/playbook.md`) that never changes for a specific case, alongside its own `playbook/presentation/` for materials that explain and sell the Playbook itself, separate from any one run's content.

Each application of the Playbook to a real case lives in its own folder under `runs/<company-or-case>-<year>/`. Within that folder:

- `scope.md` and `evidence-log.md` hold the run-wide assumptions and sourced evidence, written once and referenced by every candidate rather than copy-pasted into each.
- `opportunities.md` holds every candidate opportunity surfaced at Stage 1, its scoring and its strategic fit result — this is where breadth is shown: several real options, not just the winner.
- Every candidate that survives the strategic fit test gets its own subfolder, for example `candidate-a-<short-name>/`, holding that candidate's `stage1-case-file.md` (sizing, cannibalization, hypotheses) plus its own `prototype/` (working test artifacts from Stage 4/5) and `presentation/` (the polished, client-facing deliverable for that candidate specifically). A candidate parked before sizing stays in `opportunities.md` only — it doesn't get a subfolder until it earns one.
- `gate-decision.md` sits at the run level and makes the actual call by comparing every sized candidate side by side, not by picking the best-looking one before the numbers are in.
- Once a candidate is chosen to proceed past Stage 1, each later stage it goes through adds one more file to that candidate's subfolder, named after the stage: `stage2-problem-discovery.md`, `stage3-hypothesis-map.md`, `stage4-cheap-tests.md`, and so on. Each file holds that stage's outputs as specified in its section above (for Stage 2: segment definition, coded interviews, job statement; for Stage 3: concept one-pager, ranked register, test backlog; for Stage 4: filled test templates and results) and ends with that stage's own gate decision record — distinct from the run-level `gate-decision.md`, which only ever compares candidates at the Stage 1 exit.
- The hypothesis register is not a separate file: it is threaded across a candidate's `stageN-*.md` files by hypothesis ID. Seed hypotheses are written once in `stage1-case-file.md`; later stages update the status of those same IDs by reference (supported, refuted, inconclusive) and add any new IDs they raise, rather than copying the whole register forward each time.

This keeps the Playbook reusable and unpolluted by any one run's content, keeps breadth (several candidates) visibly separate from depth (one candidate's full validation), and lets several runs of the same playbook exist side by side without collision. If a parked or reclassified candidate later earns its own validation track, it gets its own run folder, not a subfolder here — a full re-score is a new Stage 1, not a continuation of this one.

**Confidence scale**

- **High:** behavioral evidence from two or more independent sources, or a test where people committed real money or contact details.
- **Medium:** one behavioral source, or five or more consistent interviews.
- **Low:** desk research, opinion, or a single interview.

**Agent contract**

1. Every number and claim carries an evidence-log ID. No uncited figures.
2. A figure taken from memory or estimated is written as an assumption with a range, and enters the register as a hypothesis.
3. The agent stops and hands over at every human checkpoint listed in each stage.
4. The agent never contacts customers, spends money, changes prices or publishes anything externally without approval.
5. The last output of every stage is a gate decision record. The agent proposes the decision and its reasons; a named human approves it.

## Stage 1: Opportunity framing

**Goal:** decide whether an opportunity deserves a discovery budget, using a sized prize range and a one-line problem statement.

**Inputs:** strategy brief (target segments, constraints, minimum prize), a discovery budget ceiling, and access to the signal sources below.

**Signal sources**

| Type | Sources |
| --- | --- |
| Internal data | Churn and win-back reasons, support ticket clusters and repeat contacts, consumption and app usage data, segment margins, NPS and CSAT free-text comments |
| Frontline | Sales, call centre and installer input (a short monthly session) |
| External | Competitor launches, Nordic markets that preview what arrives next, regulation and tariff changes, subsidies, technology and partner capability |

**Agent steps**

1. Collect signals from every available source and log each as an evidence item.
2. Cluster signals into candidate problems and log each problem statement as a desirability hypothesis. Write each as: "[Segment] struggles to [job] because [barrier]; today they [workaround]."
3. Score each candidate 1-5 on frequency, pain, size and ease of reaching the segment. Keep the top three.
4. Run the strategic fit test on each of the three (table below). Park any candidate that fails a question, and log any unclear answer as a hypothesis.
5. Size the prize for each surviving candidate: addressable customers × realistic adoption × value per customer per year. Produce conservative, base and optimistic cases.
6. Add indirect value separately from fees: churn reduction, margin per customer, acquisition cost saved.
7. Check cannibalization: which existing offerings lose revenue if this succeeds, and by how much.
8. Log every input to the sizing as a hypothesis in the register, with a source or an "assumption" label.
9. Write a case file for **every surviving candidate** (one per candidate, in its own subfolder — see Storage convention below), not just the top scorer. Then compare the sized candidates side by side in a single run-level gate decision that proposes which candidate(s) proceed.

**Strategic fit test**

| Question | What to establish | Evidence to collect | Fail signal |
| --- | --- | --- | --- |
| Strategic priority | Does it advance a stated company priority (target segments, growth areas, role in the energy transition)? | Strategy documents, leadership brief | No priority it supports, or it competes with one |
| Right to win | Why would we beat rivals here: customer base, data, brand, assets, partners, licences? | Advantage list with proof, competitor comparison | No advantage over rivals that we can name and prove |
| Capability and risk | Can we build and run it, and does it endanger the core business or brand? | Capability gap list, legal and regulatory scan, channel-conflict and brand risks | A critical capability is missing with no build or partner path, or a licence barrier blocks entry |

Score each question pass, unclear or fail. A fail parks the candidate; an unclear answer becomes a hypothesis in the register.

**Multi-product and bundling lens.** A single-company view of "right to win" undercounts what a multi-line business already has. Before scoring right to win, check two things:

- **Cross-sell across the company's own product lines.** List every other product or service the company already sells to the same household (energy, connectivity, mobility, insurance, financial products, and so on). A new offering that plugs into two or three of these has a stronger right to win than one built in isolation, because it can share the billing relationship, the data, and the acquisition cost. Score this explicitly as part of "right to win," not as an afterthought.
- **External bundling and partner loyalty.** Separately from owned products, scan for signs that companies in adjacent sectors are already bundling with each other, for example a telecom operator's loyalty programme offering discounted rides from a mobility app, or a bank card offering partner cashback at named retailers. This is evidence that customers respond to cross-sector bundles, and it opens a build-vs-partner choice: the company can build the whole offering itself, or reach the same value by partnering with a company that already owns a piece of it. Log any such signal as evidence, and treat "build, partner, or both" as a hypothesis for Stage 3, not a decision made at Stage 1.
- Adjacent-market footprint, added on review. If the company operates the same or a similar business in neighboring countries, treat those markets as a source of evidence, not just structure. Two uses: (1) analogous-market evidence — an offering, price point, or feature already live in a sibling market can proxy for demand or feasibility at home before any local customer data exists, though it should be labeled as a weaker, cross-market proxy in the evidence log, not as home-market evidence; (2) competitive-urgency signal — watch for a competitor (not just the company's own sibling entity) already building toward the same concept across those neighboring markets, since that raises the cost of moving slowly and can shift a gate from a comfortable Hold toward a time-boxed one.

**Outputs:** ranked candidate list, one case file per surviving candidate (sized prize as a range with named assumptions, cannibalization check, seed hypotheses), and a single run-level gate decision record that compares them.

**Gate**

Apply the Go/Kill/Pivot-or-hold test below to each surviving candidate individually, then write one gate decision record for the run that compares the results and states where the discovery budget goes. A candidate is not the winner just because its base case is bigger — weigh execution cost, evidence quality on the weakest input, and legal risk alongside the number, the same way the comparison in Section "Gate decision record" below asks for reasons plural, not a single figure.

- **Go** if the base-case prize meets the minimum set before the work started (for example, ten times the discovery budget), the strategic fit test is passed, no legal blocker is visible, and a realistic path to reach the segment exists.
- **Kill** if even the optimistic case misses the minimum.
- **Pivot or hold** if the prize depends on one unverified input. Name that input.
- **When two or more candidates are still live after sizing:** don't default to the larger base case. Compare capital intensity, cost to de-risk further, and legal risk alongside the numbers — a smaller, cheaper-to-validate candidate can be the better first bet even with a lower sized prize.

**Human checkpoints:** approve the minimum prize and discovery budget before the stage starts; approve the chosen candidate at the gate.

**Agent brief:** "Run Stage 1 for the segment and constraints in the strategy brief. Log all evidence with sources. Return three sized candidates as ranges, flag every unverified input, and propose a gate decision. Do not contact anyone."

### Handover to Stage 2

- The run-level gate decision record, naming which candidate(s) were selected to proceed and why, compared against every other sized candidate.
- That candidate's own case file, with its sized prize range, cannibalization check and seed hypotheses — not the whole candidate set.
- Seed hypotheses in the register, from four sources: the problem statement (desirability), the sizing inputs (viability), any "unclear" strategic fit answers, and the cannibalization assumptions.
- Evidence log with a confidence rating on every item.
- The approved discovery budget, which the gate decision may split across more than one candidate rather than handing it all to a single winner.

## Stage 2: Problem discovery

**Goal:** confirm that the problem is real, frequent, painful, already worked around by customers, and located in a segment we can reach.

**Inputs:** Stage 1 case file and seed hypotheses, access to customer and usage data, a way to recruit interviewees, and consent wording approved by legal.

**Agent steps**

1. Define the segment in the data (contract type, consumption pattern, device ownership, tenure). Measure its size and compare its behavior with the rest of the base.
2. Mine support tickets, call notes and free-text feedback. Count the share of the segment that mentions the problem, and quote the wording customers use.
3. Draft the interview guide around past behavior: the last time it happened, what they did, what it cost in money and time, what they tried, and why it is still unsolved. No pitching, no hypotheticals.
4. Draft the recruiting list: 8-12 people across sub-segments, including churned customers and non-customers. Recruit for behavior, not enthusiasm.
5. After each interview, transcribe and code it: trigger event, frequency, severity, workaround, money or time spent, who decides, and any surprise. Log each coded finding as evidence.
6. Synthesize: rank problems by frequency and severity, write the customer job in one sentence ("When [situation], I want to [job], so I can [outcome]"), and refine the segment.
7. Update the hypothesis register and the Stage 1 prize inputs with what the data and interviews showed.

**Outputs:** segment definition with size, coded interview set, ranked problem list, job statement, updated register and prize range, gate decision record.

**Gate**

Set these thresholds before interviews start. Example values: pass if at least 6 of 10 interviewees described the problem unprompted within the last three months, at least half already use a workaround or pay to handle it, and behavioral data confirms the segment is at least as large as the Stage 1 assumption.

- **Go** if the thresholds are met.
- **Pivot** if the problem is real but sits in a different segment or job than assumed.
- **Kill** if fewer than three of ten recognize the problem or nobody has a workaround.

**Human checkpoints:** approve the interview guide, recruiting list and consent wording; conduct or attend the interviews; approve the gate.

**Agent brief:** "Run Stage 2 for the case file. Produce the segment analysis from data, the ticket analysis, the interview guide and recruiting list for approval. After interviews, code the transcripts, synthesize, update the register, and propose a gate decision."

### Handover to Stage 3

- Segment definition with its size from data.
- Coded interview set and ranked problem list.
- One-sentence job statement.
- Register updated: each seed hypothesis marked supported, refuted or inconclusive, plus new hypotheses raised by interviews.
- Revised prize range.

## Stage 3: Hypothesis map

**Goal:** turn the concept into a ranked list of testable assumptions, each with a metric, a kill threshold and the cheapest test that could settle it.

**Inputs:** job statement and ranked problems from Stage 2, seed hypotheses from Stage 1, and a named reviewer for each of legal, operations, IT, pricing and finance.

**Agent steps**

1. Draft a one-page concept: segment, job, offer, price range, channel and revenue mechanism.
2. Walk the customer journey (aware, interested, signs up, uses, pays, stays, recommends) and the business model (cost, channel, operations, legal). Write down every assumption the concept needs to be true.
3. Tag each assumption: **desirability** (do they want it), **viability** (does it make money), **feasibility** (can we build and run it), **legal** (are we allowed to).
4. Score risk (impact if wrong, 1-5) and uncertainty (how little evidence exists, 1-5). Priority = risk × uncertainty.
5. For the top 8-10, write the statement in the standard format and add the metric, a kill threshold, a pass threshold and the cheapest test from the Stage 4 menu.
6. Send each tagged row to its function reviewer early. Legal, operations, IT, pricing and finance see their rows now, not at launch readiness.
7. Order the tests: highest priority first, and mark which can run in parallel.

| Priority (risk × uncertainty) | Action |
| --- | --- |
| 16-25 | Test first, before any build |
| 9-15 | Test next, or fold into a combined test |
| 8 or lower | Monitor; revisit at the pilot |

**Outputs:** ranked hypothesis register, test backlog with order and owners, concept one-pager, gate decision record.

**Gate**

- **Go** if every top-10 hypothesis has a metric, both thresholds and a test; the top three include at least one desirability and one viability hypothesis; and legal and feasibility reviewers have signed their rows.
- **Pivot or kill** if desk review already refutes a legal or feasibility hypothesis.

**Human checkpoints:** the decision-maker signs the kill thresholds before any test runs; function reviewers approve their rows.

**Agent brief:** "Run Stage 3 from the case file. Build the register with risk, uncertainty, thresholds and tests for the top ten hypotheses. Route rows to the named reviewers, collect their edits, and propose a gate decision."

### Handover to Stage 4

- Ranked register: for the top 8-10, the metric, pass and kill thresholds and the test, with thresholds signed by the decision-maker.
- Test backlog with order and owners.
- Concept one-pager.
- Function reviewer sign-offs on the legal and feasibility rows.

## Stage 4: Cheap tests

**Goal:** settle the riskiest hypotheses with behavioral evidence before anything is built at scale.

**Inputs:** ranked register with signed thresholds, test backlog, and approval for a test budget and audience.

**Test menu**

| Hypothesis type | Test | Behavioral signal that counts |
| --- | --- | --- |
| Desirability | Fake door: landing page or in-app banner offered to existing customers | Click-through and waitlist sign-ups with contact details |
| Desirability | Concept session with a simple prototype | Customers agree to a next step (trial, call, pre-registration), not just praise |
| Viability, price | Price-variant landing pages shown to comparable audiences | Conversion by price point |
| Feasibility, service | Concierge test: deliver the service manually to 10-20 volunteers | Effort per customer, error rate, would they keep it |
| Feasibility, technical | Time-boxed technical spike on the riskiest integration | Works or does not, with a time estimate |
| Legal | Desk review, then a written opinion from legal | Cleared, cleared with conditions, or blocked |
| Viability, economics | Unit economics model fed with test results, plus sensitivity range | Contribution per customer per month in base and low cases |

**Test design template** (one per test, frozen in the register before launch)

| Field | Content |
| --- | --- |
| Hypothesis ID and statement | From the register |
| Audience and sample | Who sees it and how many; large enough that the pass and kill thresholds can be told apart |
| Method and duration | From the menu; fixed run window |
| Primary metric | One metric only |
| Pass threshold | Result at or above this counts as supported |
| Kill threshold | Result at or below this counts as refuted |
| Inconclusive zone | Between the two thresholds |
| Cost, owner, consent needs | Budget, named person, data and consent handling |

**Agent steps**

1. For each queued hypothesis, choose the test and fill the template.
2. Freeze thresholds in the register with a timestamp before launch.
3. Prepare test assets (page copy, banner, script, survey) and send for approval.
4. Run the approved test inside its window. Do not stop early on a good-looking result; stop early only if a guardrail is hit.
5. Analyze against the frozen thresholds, log the evidence, and set the hypothesis status.
6. Record each result as: hypothesis, test, result, decision (pass, fail, or inconclusive with the next action).
7. Update the unit economics model with the observed rates and propose a gate decision.

**Decision rules:** a pass marks the hypothesis supported. A fail marks it refuted and triggers pivot or kill review. An inconclusive result allows one longer or larger rerun; if it is still inconclusive, treat it as a fail.

**Outputs:** filled test templates, evidence log entries, updated register statuses, updated economics model, gate decision record.

**Gate**

- **Go to pilot** if the top three hypotheses are supported, no showstopper is refuted, the price range holds, and the economics model is positive in the base case using observed rates.
- **Pivot** if the value is confirmed but price, segment or mechanism failed.
- **Kill** if desirability or the core economics is refuted.

**Human checkpoints:** approve every customer-facing asset, audience, spend and consent wording. Fake door pages must state clearly that the product is not yet available and must not take payment. Approve the results before the gate.

**Agent brief:** "Run Stage 4 for the top-ranked hypotheses. Fill one test template each, freeze thresholds, prepare assets for approval, and after approved runs analyze the results strictly against the thresholds. Propose the gate decision."

### Handover to Stage 5

- Register with statuses updated from the test results.
- Filled test templates and their evidence entries.
- Economics model rebuilt with observed rates.
- Validated price range.
- Concept and minimal product specification.

## Stage 5: Pilot

**Goal:** show that the offering works with real customers on real contracts, in economics and in operations, before any full launch.

**Inputs:** Stage 4 evidence and updated economics model, approved price range, a minimal product specification, draft customer terms, and operational readiness for a small cohort.

**Agent steps**

1. Define the pilot scope: only the features the supported hypotheses require, one price, terms with an easy exit, and a duration long enough to cover a full billing cycle and any seasonal effect that matters.
2. Size the cohort at roughly 100-500 customers. Where possible, keep a matched control group of similar customers without the offering.
3. Write the measurement plan: for each metric, the question it answers and a threshold taken from the economics model (retention, conversion, price realized, support contacts per customer, cost to serve, margin, cannibalization, satisfaction).
4. Set guardrails with pause triggers: complaint rate, billing error rate, support load, any customer harm.
5. Prepare readiness items with their owners: customer terms and consumer-protection review, billing, support script, IT, data handling. Send each for sign-off.
6. Propose the cohort list and invitation text for approval. Do not invite anyone before approval.
7. Run weekly: refresh the dashboard, compare every metric with its threshold and every guardrail with its limit, and send a short readout that flags breaches.
8. Interview about ten pilot customers at the midpoint and at the end: why they stayed, why they left, what surprised them.
9. Compute unit economics from actuals and measure cannibalization against the control group.
10. Write the pilot report and propose a gate decision.

**Outputs:** measurement plan, weekly readouts, coded exit interviews, actual unit economics, cannibalization estimate, pilot report, gate decision record.

**Gate**

- **Go to launch readiness** if retention and price realized meet their thresholds, contribution margin is positive in the base case, support load is within capacity, cannibalization is within the agreed limit, and no guardrail breach is unresolved.
- **Extend or fix** if one metric misses and the cause is understood and fixable within a defined time.
- **Pivot or kill** if retention or margin misses with no credible fix.

**Human checkpoints:** approve pilot terms, cohort and guardrail limits before launch; the named owner decides on any pause; approve the report before the gate.

**Agent brief:** "Run Stage 5. Produce the pilot scope, measurement plan and guardrails for approval. After launch, produce the weekly readout against thresholds, flag any breach immediately, and at the end write the pilot report with actual unit economics and a proposed gate decision."

### Handover to Stage 6

- Pilot report with actual unit economics and the cannibalization estimate.
- Final price and customer terms as tested in the pilot.
- Coded exit interviews and lessons learned.
- Guardrail limits that worked, as the starting point for rollout.

## Stages 6-8: Launch readiness, rollout, scale or sunset

These stages follow the same pattern (inputs, agent steps, gate, human checkpoints) and are specified in less detail. Expand them once a pilot has passed.

**Stage 6: Launch readiness**

- Confirm final pricing and positioning from pilot data, including the core message and who the offering is not for.
- Run a readiness checklist with a named owner and sign-off per row: legal and consumer-protection terms, billing and systems, support training and scripts, sales training, marketing assets, data protection, reporting, and the cannibalization plan.
- Set the rollout plan, guardrail metrics and pause triggers.
- **Gate:** every checklist row signed, or an accepted risk recorded with an owner.

**Stage 7: Staged rollout**

- Ramp in cohorts (for example 10%, 25%, 50%, 100% of the eligible base), holding each step until guardrails stay in range for a set period.
- Watch guardrails weekly: complaints, billing errors, support load, churn in the cohort against the control, and cannibalization.
- **Gate per step:** guardrails in range and the economics model still holds. A breach pauses the ramp until the owner decides.

**Stage 8: Scale, review, sunset**

| Review | Question | Decision |
| --- | --- | --- |
| 30 days | Are early behavior and support load as expected? | Continue, fix, or pause |
| 90 days | Do retention, price realized and margin match the pilot? | Scale, fix, or narrow the segment |
| 180 days | Does the offering beat its original hypotheses and the prize estimate? | Scale, keep as is, or sunset |

- Every review compares actuals with the hypothesis register, updates the register statuses, and records what the team would do differently.
- A sunset plan (customer notice, migration path, contract exit) is written before launch, not after a failure.

**Agent brief for stages 6-8:** "Maintain the readiness checklist and chase sign-offs; during rollout produce the weekly guardrail readout and flag breaches immediately; at each review, compare actuals with the register and propose scale, fix or sunset."

## Adapting for new-to-company businesses

For a business the company doesn't already run, keep the same eight stages and gates, but change the evidence used and shrink each funding step, because there is no customer base or usage data to lean on.

| Stage | What changes | Do this instead |
| --- | --- | --- |
| 1. Opportunity framing | No churn, ticket or usage data | Use external signals (competitors, analogous markets abroad, regulation, technology shifts), top-down and bottom-up market sizing, and give the strategic fit test full weight |
| 2. Problem discovery | No customers to sample | Interview 15-20 non-customers in the target segment, treat competitor reviews and forums as behavioral evidence, and add interviews with suppliers and partners |
| 3. Hypothesis map | New assumption types dominate | Add licences and regulation, partner availability, supply capacity, technology readiness, and brand and channel-conflict risk; rank legal and feasibility rows first |
| 4. Cheap tests | No own base for a fake door | Buy reach through paid ads or a partner's audience, lean on concierge tests, and state clearly on every page that the product is not yet available |
| 5. Pilot | May need a separate set-up | Ring-fence the budget and use partner delivery or separate terms; check whether a licence or separate legal entity is needed; a smaller cohort can be enough if each customer teaches a lot, but say so in the gate record |

**Funding rule:** treat stages 1-4 as buying options, not committing to a launch. Release a small budget per gate, set a stop-loss (the total spend at which a mandatory review happens), and expect more ideas to die.

**Evidence rule:** accept medium-confidence evidence to pass the early gates, but require high-confidence behavioral evidence before any pilot spend.

## Omnichannel lens

Most segments already reach the company, and expect to be reached back, through more than one channel — web, mobile app, call centre, physical branches, and others depending on the case. Channel is not a separate stage; it is a check applied at the relevant point in the existing eight, the same way the multi-product and bundling lens applies at Stage 1 and the new-to-company adaptation applies across the early stages.

| Stage | What channel adds | Do this instead |
| --- | --- | --- |
| 1. Opportunity framing | Signal sources skew toward whichever channel already tracks well (usually app/web analytics); call-centre and branch signal quality is uneven and easy to under-collect | When gathering frontline input, pull call volumes and topics by channel and branch foot traffic and staff feedback explicitly, not just a general monthly session; note in the case file which channel(s) already carry volume for this problem |
| 2. Problem discovery | A segment's channel behavior is part of its definition, not a footnote | Ask directly in interviews how the customer currently handles this (calls, visits a branch, uses the app, goes online); code the answer as a segment attribute alongside frequency and severity |
| 3. Hypothesis map | The customer journey (aware → interested → signs up → uses → pays → stays) can run through a different channel at each step; a hypothesis that silently assumes the wrong one is a hidden risk | When walking the journey, name the channel each step runs through; flag any hypothesis that assumes a channel the segment doesn't actually prefer, and add that mismatch to the register as its own risk |
| 4. Cheap tests | The default test menu (fake door, landing pages) only reaches segments already active on web or app; a call-centre- or branch-led segment won't show up in that funnel at all | Match the test to the channel the segment is actually in: a scripted live pitch through call-centre agents, an in-branch offer to walk-in customers, or an IVR/app-banner variant — score against the same pass/kill thresholds as any other test |
| 6. Launch readiness | A generic "support training" checklist row hides whether every channel that will actually sell or service this is ready | Split channel readiness into its own signed-off rows: call-centre script and agent training, branch staff training and in-branch collateral, app/web release readiness — each with its own named owner |
| 7. Staged rollout | An aggregate guardrail can look healthy while one channel is quietly failing underneath it | Track guardrails per channel as well as in aggregate: call-centre average handle time and complaint rate, branch queue time, app/web drop-off and error rate; a channel-specific breach pauses that channel's ramp even if the aggregate is fine |

One rule applies everywhere in the table above: **test in the channel you intend to launch in.** A desirability result from a web fake door does not transfer to a segment that actually decides and buys through a call centre or a branch conversation. If the intended launch channel differs from the test channel, that gap is itself a hypothesis to close before Stage 5.

## Metrics: validation versus success

Validation metrics answer "is the hypothesis true?" and retire at the gate that settles them. Success metrics answer "is the offering working as a business?" and need a baseline measured before launch.

| Kind | Metric | Used in | Question it answers |
| --- | --- | --- | --- |
| Validation | Share of interviewees who recognize the problem unprompted | Stage 2 | Is the problem real? |
| Validation | Share already using a workaround or paying to solve it | Stage 2 | Is it painful enough to act on? |
| Validation | Fake door click-through and waitlist conversion | Stage 4 | Do they want this offer? |
| Validation | Conversion by price point | Stage 4 | Will they pay, and how much? |
| Validation | Effort and error rate per customer in the concierge test | Stage 4 | Can we deliver it? |
| Validation | Pilot retention and price realized | Stage 5 | Do real customers stay and pay? |
| Validation | Contribution per customer per month | Stages 4-5 | Does it make money? |
| Success | Penetration of the eligible base | Stages 7-8 | Is it adopted at the expected rate? |
| Success | Churn of offering customers against a control group | Stages 7-8 | Does it keep customers? |
| Success | Average revenue per customer and attach rate | Stages 7-8 | How much value per customer? |
| Success | Contribution margin and acquisition payback | Stages 7-8 | Is the model sustainable? |
| Success | Net cannibalization of existing offerings | Stages 7-8 | Is growth real or shifted from elsewhere? |
| Success | Support contacts per customer and satisfaction score | Stages 7-8 | Is it easy to run and to live with? |

Every metric maps to a hypothesis ID in the register. A metric with no hypothesis is dropped.

## Agent boundaries and human checkpoints

An agent can run the analysis, drafting and monitoring in every stage alone. Anything that touches customers, money, prices, personal data or external publishing needs a named human's approval first.

| Agent may do alone | Needs human approval first |
| --- | --- |
| Collect and cite public and internal data it has access to | Access to new internal data sources or personal data |
| Cluster signals, size prizes, build and rank the register | Minimum prize, discovery budget and kill thresholds |
| Draft interview guides, test templates, landing page copy, readiness checklists | Sending any of them to customers or publishing externally |
| Code transcripts and analyze results against frozen thresholds | Contacting or recruiting any customer |
| Produce weekly readouts and flag breaches | Spending, changing prices, or pausing a live pilot |
| Propose gate decisions with reasons | The gate decision itself, which a named person owns |

**Data and privacy rules:** use only the customer data the approved purpose allows, keep interview material and personal identifiers out of the shared evidence log (use interview IDs), and follow the organization's data protection policy for consent and retention.

**When the agent must stop and ask:** a decision that cannot be undone and could reasonably go either way; a source that conflicts with another and changes a gate result; a threshold that was not set before the test; any sign of customer harm.

2026-09-21 · Applies to every candidate opportunity in this run. This is the run's precondition document: it must be settled before Stage 1 evidence-gathering restarts, not adjusted mid-run to fit whatever the sizing produces.

This is a homework/self-run application of `playbook/playbook.md`, not a company-commissioned engagement: there is no strategy brief, no internal data access, and no named business approver. The restrictions below stand in for those missing inputs and are treated as fixed for the run unless explicitly revised here.

## Segment and sources

| Item | Value used | Status |
| --- | --- | --- |
| Segment | B2C electricity/energy customers in Estonia is the fixed scope; the sub-segment (household type, tenure, contract type) is intentionally left open and should follow whatever the evidence shows, not a preset assumption | Approved by Jüri Tomingas, 2026-09-21 |
| Sources allowed | Public web, public statistics, regulator and company publications, competitor sites | Set |
| Sources not available | Enefit internal data (churn, tickets, usage, CRM), a strategy brief, legal counsel, a financing/leasing partner quote | Set — every hypothesis that would need one of these stays untested and is logged as a hypothesis, not resolved by proxy |
| Customer contact | None without explicit approval logged here first | Set |
| Group footprint note | Eesti Energia/Enefit operates across Estonia, Latvia, Lithuania and Poland with 560,000+ retail customers. Scope stays Estonia per the assignment; other markets count only as analogous-market evidence or competitive-threat signal, never as home-market evidence | Set |

**Effect on confidence:** without churn reasons, ticket clusters or usage data, every problem is scored from external proxies. Evidence defaults to Medium or Low on the playbook's confidence scale until real interviews or internal data enter the log; every candidate's sizing and gate proposal must say so plainly rather than presenting ranges as settled.

## Budget ceilings, by stage

The previous pass used one flat "discovery budget" (€50,000) covering everything through Stage 4. That conflates two different things: the cost to size and screen an opportunity (cheap, mostly analyst/agent time) and the cost to actually test it with real people (the number that should scale with what a stage risks). Splitting it by stage makes each ceiling defensible on its own, instead of one round number inherited from the last run.

| Stage | Ceiling | Reasoning | Status |
| --- | --- | --- | --- |
| 1. Opportunity framing | No cash budget — time-boxed desk research only | Public-source sizing and scoring cost analyst/agent time, not spend | Set |
| 2. Problem discovery | €500-1,000 | Covers interview incentives for 8-12 interviewees (or 15-20 non-customers under the new-to-company adaptation) plus a recruiting panel fee if one is used; no paid media | Approved by Jüri Tomingas, 2026-09-21 |
| 3. Hypothesis map | No dedicated budget | Synthesis and function-reviewer time only | Set |
| 4. Cheap tests | €500-1,500 per test, €2,000-6,000 total across the queued hypotheses | See "Why cheap tests are cheaper now" below | Approved by Jüri Tomingas, 2026-09-21 |
| 5. Pilot | Capped by capital intensity — see table below, not one number | A pilot for a software-only candidate and a pilot for a hardware-and-financing candidate are not the same order of spend; one ceiling would either starve the cheap candidate or be meaningless for the expensive one | Approved by Jüri Tomingas, 2026-09-21 |

### Why cheap tests are cheaper now

The €50,000 discovery budget in the previous pass was sized for a world where a fake-door page, a concierge-test script or a price-variant landing page each needed a dedicated build. With AI-assisted tooling (AI site builders, agent-drafted copy and prototypes, no-code forms), the build cost of most Stage 4 tests on the menu collapses to near zero — the real spend is traffic and incentives, not construction:

| Test | What actually costs money now | Realistic range |
| --- | --- | --- |
| Fake door landing page / banner | Paid traffic to get a statistically usable sample (Estonia is a small, low-CPC market) | €300-800 |
| Concierge test (10-20 volunteers) | Honorarium per volunteer, not build cost | €200-1,000 |
| Price-variant landing pages | Same traffic logic, run across 2-3 variants | €500-1,000 |
| Technical spike | Engineering time already covered by the team, not a separate line | €0 dedicated |
| Legal desk review | Only a cost if outsourced to external counsel; free if resolved in-house | €0-1,500 |
| Economics model | Analyst/agent time | €0 dedicated |

A €50,000 ceiling for this stage would be roughly 10-20x what any single test on the menu actually needs today. Setting it artificially high invites tests that are bigger than the hypothesis warrants, which cuts against the playbook's own "evidence grows with spend" rule — spend should track the risk being retired, not the budget available.

### Pilot cost, by capital intensity

Stage 5 is where this really matters, because the two most likely candidate types from Stage 1 sit at opposite ends of capital intensity, and one pilot ceiling would misprice one of them:

| Candidate profile | Pilot cost driver | Realistic range for 100-500 customers | Implication |
| --- | --- | --- | --- |
| Software/automation (no hardware, layered on an existing billing relationship) | Engineering, support headcount time, a waived or discounted fee for early users | €5,000-20,000 | Fits inside a self-funded pilot; AI-assisted engineering keeps marginal cost per customer near zero |
| Hardware-and-financing (installation, equipment, consumer credit exposure) | Real equipment and installation cost per customer, not just service delivery | €50,000-300,000+ depending on subsidy or leasing structure | Above roughly €50,000 without an external financing or leasing partner funding the hardware, this is a signal to hold or kill before Stage 5, not a number to self-fund from this run's budget |

This is a business-scale judgment about what a hardware pilot actually costs, not a validation-cost estimate — treat any specific figure a candidate's case file produces as a hypothesis with a range, same as every other unsourced input, and cite it as such.

## Minimum prize

| Item | Value used | Status |
| --- | --- | --- |
| Minimum prize | Base case of at least €500,000/year | Approved by Jüri Tomingas, 2026-09-21 |

The previous pass derived this as "10x the discovery budget." That heuristic breaks once the budget itself shrinks for reasons that have nothing to do with how big the opportunity needs to be — cheaper tooling doesn't make Enefit's bar for a new revenue line any lower. The minimum prize is kept at the same €500,000/year figure as before, but as an independent business-scale judgment (a new package should be a meaningful line relative to Enefit's existing B2C portfolio), not as a multiple of the Stage 4 budget above. If a real minimum prize is ever supplied by an actual strategy brief, it replaces this figure outright rather than being reconciled with it.

## Approvals

All items above were approved by **Jüri Tomingas**, standing in as the named business approver for this homework run, on 2026-09-21. Evidence log, opportunity list and gate decision are rebuilt fresh from live research when Stage 1 runs — nothing from the deleted previous pass carries forward as evidence, since the point of restarting was not to inherit its assumptions unexamined.

## Proposed decision

**Go on Candidate 1. Pivot/hold on Candidate 3. Kill on Candidates 2, 4 and 5.**

Five reasons, one per candidate, since every candidate earned its own analysis this pass:

1. **Candidate 1 clears the minimum prize with the strongest evidence and the lowest execution cost.** Its base case (€840,000/year) is meaningfully above the €500,000/year minimum prize, its conservative case, while below the bar, is not wildly so, and it needs no hardware, installation or financing-partner dependency to work — it is a pricing/billing product layered on Enefit's existing customer relationship. Per the playbook's own "don't default to the larger base case" rule, Candidate 1 wins this comparison on execution cost and evidence quality, not just on the number.
2. **Candidate 2 fails on two independent grounds.** It fails the strategic fit test's right-to-win question outright (two Baltic-adjacent competitors already have a live product, no evidenced Enefit capability), and even setting that aside, its base case (€450,000/year) misses the minimum prize on its own economics, with a structural tension (the optimizer's savings work against Enefit's own energy margin) that makes its sizing less trustworthy than Candidate 1's.
3. **Candidate 3's prize is real but thin, and depends on one unresolved input.** Its base case exactly clears the minimum prize and its conservative case misses it, and the whole candidate's viability past Stage 1 hinges on securing a financing/leasing partner (H3.4) — an input `scope.md`'s own pilot-cost guidance already flags as a hold/kill signal if unresolved. This is the playbook's "pivot or hold if the prize depends on one unverified input" case, with that input named.
4. **Candidate 4 fails right-to-win and has the weakest economics of the five.** No evidenced installer or financing capability at all, and unlike Candidate 3 it has no existing Enefit infrastructure (small-producer package, storage assets) to extend from; its base case (€240,000/year) is the weakest of any candidate sized this pass. Its one genuine upside — heating electrification adds grid consumption rather than cannibalizing it — is not enough to outweigh the missing right-to-win.
5. **Candidate 5 passes strategic fit but is killed on prize size alone.** Even its optimistic case (€210,000/year) misses the €500,000/year minimum prize, which the playbook's own gate rule treats as an unconditional kill ("Kill if even the optimistic case misses the minimum") regardless of how clean its strategic fit result is. Logged for a future pass if Estonia's EV fleet grows enough to change the sizing.

## Where the budget goes

The full Stage 2 discovery budget (€500-1,000, approved in `scope.md`) goes to Candidate 1 alone — one candidate proceeds. Candidate 3 is held, not killed outright — its base case does clear the minimum prize, so it stays logged with its case file as a live candidate to revisit specifically once (a) an Estonia-only Enefit household customer count and (b) a real answer on a financing/leasing partner become available, either of which could move it from "hold" to "go" or to "kill" without redoing the whole Stage 1 pass. Candidates 2, 4 and 5 are killed, not held — each has a specific, named reason above, but all three stay fully documented in their own case files rather than being reduced to a one-line note, in case a future pass wants to revisit the input that would need to change (H2.3 for 2, H4.4 for 4, H5.3 for 5).

- H1.2 — no internal strategy brief confirms this fits a stated Enefit priority; treated as an open hypothesis, not a blocker, since the competitive-urgency signal (E2) stands on its own.
- H1.6 — cannibalization of Enefit's own existing packages is likely to be the dominant effect rather than net-new revenue; Stage 2 interviews should probe whether customers see this as a genuinely new option or just "which existing package do I pick," since that materially changes how the value story should be framed going into Stage 3.

## What the public-signal pass found (steps 2 and 6)

Sources: Postimees market/news coverage, Enefit's own blog, and two public household forums (Perekooli Foorum, biker.ee) used as a ticket-mining stand-in. Full citations in `../evidence-log.md`, E17-E22.

### Ranked problem signals (tentative — public signals only, not interview-validated)

1. **Bill-shock recognition is real and recurring, not a one-off.** A named June 2026 spike (daily average €93.99/MWh, evening peak €359.01/MWh) [E17] and a January 2026 bill cycle that set a new household record, worse than the 2021 crisis peak [E18], both landed inside this run's window — this isn't a hypothetical risk, it's already happened twice in 2026 alone.
2. **The "safe" alternative is getting worse just as demand for it rises.** Ahead of autumn 2026, households are actively trying to move to fixed-price contracts for winter protection, but fixed-price offers (especially six-month terms) have themselves risen sharply [E19]. This is the exact wedge Candidate 1's hybrid targets: today's binary choice is "accept volatility" or "pay a rising premium to escape it."
3. **Enefit itself already fields this often enough to need a public FAQ.** Enefit's own blog has a dedicated post answering "why is my bill high despite a low average price" [E20]. Its only offered fix is switching to Enefit's existing all-or-nothing fixed-price package — confirming, from Enefit's own content, that no hybrid exists there today (consistent with what Stage 1 found for the competitor gap against Elektrum's Paindlik Klõps).
4. **This has happened before at real scale.** A single household forum thread from the 2021-2022 energy crisis ran 34 pages and ~998 posts over several months [E21] — bill shock, discussion of switching to fixed price, and sustained engagement for months, not a two-week news cycle. Used only as historical precedent, not as evidence the same scale is happening in 2026.
5. **New, unresolved risk surfaced by this pass:** E21 also reports that, during the 2022 episode, Eesti Energia's variable "hourly" package for roughly 100,000 legacy-meter customers was actually billed on a daily-average basis, not true hourly pricing — a billing-methodology gap that undermined trust when discovered. Whether this still applies to any of Enefit's current metering base in 2026 is **unverified** and now logged as a new hypothesis (H1.7) — it matters directly to Candidate 1, since a "protection" product loses credibility fast if its own billing granularity doesn't match what it claims to protect against.

### Tentative job statement (pending real interviews)

"When my market-price electricity bill comes in far higher than I expected, I want a way to know that a bad month won't blow up my budget, so I can stay on a pricing structure that can still save me money in normal months."

This is a draft written from public signals, not from real customer language — it has not been tested against an actual interview and should not be treated as validated.

### Confidence caveat

Everything above is Low/Medium confidence on the playbook's own scale — desk research and public forum reading, not direct behavioral evidence. Per the Stage 2 gate rule, thresholds like "6 of 10 interviewees describe the problem unprompted within the last three months" cannot be evaluated from a pass like this one, and this synthesis should not be read as satisfying them.

## Interview guide (drafted per step 3 — ready, not conducted)

Past-behavior only, per the playbook's instruction: no pitching, no hypotheticals.

1. Walk me through the last time your electricity bill surprised you. When was it, and how did you find out?
2. What did you do right after seeing that bill — nothing, called the provider, looked at other packages, something else?
3. What does your current package actually charge you for electricity — do you know, roughly, without looking it up?
4. Have you ever changed electricity package or provider? What made you finally switch, if so?
5. If you haven't switched despite a bad bill, what stopped you?
6. Roughly how much time or money would you say a bad billing month has cost you, in the worst case you remember?
7. Who else in the household is involved in deciding which electricity package you're on?
8. Is there anything about how your bill is calculated that still doesn't make sense to you?

- Households on a market-price/exchange package today (the core segment).

# Stage 1 case file — Candidate 1: Price-spike / bill-protection hybrid package

**Current stage:** 1 — Opportunity framing (complete; Go approved in `../gate-decision.md`, 2026-09-21). Stage 2 in progress — see `stage2-problem-discovery.md`.
**Owner:** Jüri Tomingas (homework run — standing in as named business approver, per `../scope.md`)

## Problem statement

"Estonian households on a market-price (stock-exchange) electricity package struggle to avoid bill shocks during price-spike periods because pure market pricing has no built-in ceiling; today they either accept the volatility, overpay for a fully fixed contract, or switch supplier entirely." (H1.1)

## Segment

B2C electricity customers in Estonia currently on, or recently moved onto, a market/stock-exchange-price package — including the wave of former universal-service customers who were automatically transferred to a market package when universal service ended 30 April 2026 (E3). Sub-segment intentionally not narrowed further than this at Stage 1, per `../scope.md`'s segment note; Stage 2 interviews should test whether the pain concentrates in a narrower group (e.g., lower-income households with less price-hedging headroom) or is broad-based.

## Why now

A domestic competitor, Elektrum, already launched a directly comparable hybrid product ("Paindlik Klõps," 50% fixed / 50% market price) explicitly because early-2026 price spikes produced "surprisingly high" bills and a wave of customers reviewing their packages (E2). Separately, the 30 April 2026 universal-service closure moved every remaining universal-service customer onto a pure market-price package by default (E3) — a large, freshly price-exposed population that did not necessarily choose that exposure. These two events together are a timing signal, not just a standing market gap: Enefit does not yet have a publicly evidenced equivalent hybrid product.

## Strategic fit result (from `../opportunities.md`)

Pass (right to win, capability/risk) with one open hypothesis (H1.2: strategic priority, since no internal brief exists in this homework run — see Hypotheses below).

## Sizing

**Every input below is either cited to an evidence ID or explicitly labeled an assumption. None of these figures come from internal Enefit data — none is available in this run (per `../scope.md`).**

| Input | Value used | Basis |
| --- | --- | --- |
| Estonia B2C household base reachable by Enefit | 250,000-350,000 accounts | **Assumption** — E16 gives 560,000+ retail customers *group-wide across four countries*; no Estonia-only household figure was found in this pass, so this is a bracketed guess, not a citation. Flagged as the single most important number to replace with real data at Stage 2. |
| Realistic adoption within ~2 years of launch | 5% (conservative) / 8% (base) / 15% (optimistic) | **Assumption** — no comparable Enefit product-launch adoption-curve data available; range chosen to bracket a slow-uptake case against a case where the universal-service transition drives faster opt-in. |
| Incremental value per adopting customer per year | €20 (conservative) / €35 (base) / €60 (optimistic) | **Assumption** — this is a margin/fee premium on a hybrid vs. a standard package, not a new large fee product; range reflects that this is a pricing-mix product, not a hardware or subscription upsell. |

**Sized prize (conservative / base / optimistic):**

- Conservative: 250,000 × 5% × €20 = **€250,000/year** — misses the €500,000/year minimum prize.
- Base: 300,000 × 8% × €35 = **€840,000/year** — clears the minimum prize.
- Optimistic: 350,000 × 15% × €60 = **€3,150,000/year** — clears the minimum prize with margin.

The conservative case misses the bar; base and optimistic clear it. This is the honest range given how thin the underlying customer-count and adoption assumptions are — Stage 2 should prioritize replacing the customer-base assumption with a real number before trusting this range further.

## Indirect value (separate from fees)

Churn reduction versus rivals now offering a comparable hybrid product (Elektrum, E2) is the most plausible indirect value here, but it cannot be quantified without churn data, which this run does not have access to (per `../scope.md`). Logged as hypothesis H1.5, not included in the sized prize above.

## Cannibalization check

This is very likely to cannibalize Enefit's own existing fixed-rate and pure-market-price packages rather than pull in large numbers of net-new customers — it is a third pricing option layered onto the same base, not a new market. The honest framing of the sizing above is therefore closer to a margin-mix shift plus an anti-churn effect against rivals, not pure incremental revenue. This should be stated plainly in the gate decision rather than presented as a clean new revenue line (H1.6).

## Hypotheses raised (seed register for this candidate)

| ID | Type | Statement | Risk (1-5) | Uncertainty (1-5) | Status | Evidence |
| --- | --- | --- | --- | --- | --- | --- |
| H1.1 | Desirability | We believe market-price customers will adopt a hybrid bill-protection package because recent bill shocks made pure market exposure feel risky. We will know we are right when opt-in reaches the base-case adoption rate within 12 months of launch. | 4 | 4 | Untested | E2, E3 |
| H1.2 | Strategic | We believe this fits an Enefit growth/retention priority, but no internal strategy brief confirms it in this homework run. | 3 | 5 | Untested (unclear at strategic fit) | — |
| H1.3 | Viability | We believe the wave of ex-universal-service customers (E3) is disproportionately likely to want a hybrid product versus long-standing market-price customers. | 3 | 4 | Untested | E3 |
| H1.4 | Feasibility | We believe Enefit's existing capability to layer differentiated contract terms (proven by the insurance bundle, E4) extends to a pricing-structure product, not just an add-on service. | 2 | 3 | Untested | E4 |
| H1.5 | Viability | We believe this package reduces churn versus rivals now offering a comparable hybrid product, but this cannot be measured without churn data this run lacks. | 3 | 5 | Untested — needs internal data access | E2 |
| H1.6 | Viability | We believe most adopters will come from Enefit's own existing base (cannibalizing its own fixed/market packages) rather than from switching in from rivals. | 3 | 3 | Untested | — (assumption, no source) |

## Gate proposal (this candidate individually)

**Go**, per the playbook's Stage 1 gate rule: base-case prize (€840,000/year) clears the minimum prize (€500,000/year), the strategic fit test passed on 2 of 3 questions, no legal blocker is visible, and the segment is directly reachable through Enefit's existing billing channel. The open items (Estonia-only customer count, adoption-rate assumption, cannibalization split) are Stage 2 data-gathering and interview priorities, not reasons to hold at Stage 1 — they're exactly the kind of thing 8-12 real interviews and any internal usage-data access would settle quickly.

# Stage 1 case file — Candidate 2: Smart home energy optimizer / automated load response

**Current stage:** 1 — Opportunity framing (fully analyzed; not proceeding — see gate proposal)
**Owner:** Jüri Tomingas (homework run — standing in as named business approver, per `../scope.md`)

## Problem statement

"Estonian households with flexible-tariff or market-price contracts struggle to actually shift consumption to cheap hours because doing it manually is tedious and easy to forget; today most just don't, and let the tariff structure's savings go unrealized." (H2.1)

## Segment

Estonian B2C electricity customers on a flexible or market-price tariff — a segment that grew mechanically larger on 30 April 2026, when universal service ended and every remaining universal-service customer defaulted onto a market-price package (E3). Sub-segment not narrowed further at Stage 1.

## Why this looked promising

The same market-price exposure that motivates Candidate 1 also creates a live-savings opportunity: a customer on a market-price tariff who shifts consumption to cheap hours saves money without needing a new contract at all, just automated behavior. Baltic-adjacent competitors have already built toward this — Ignitis runs 15-minute dynamic tariffs in Lithuania (E13), and Tibber's model (dynamic pricing plus a retrofit smart-meter add-on) is referenced as relevant to the region (E14).

## Strategic fit test result

| Question | Answer | Evidence |
| --- | --- | --- |
| Strategic priority | Unclear — plausible fit with a general flexibility/energy-transition narrative, but no internal brief confirms it in this homework run. Logged as hypothesis H2.2. | — |
| Right to win | **Fail** — no evidence Enefit has shipped or is building an automated/app-driven load-shifting feature (E8), while two Baltic-adjacent competitors already have live dynamic-pricing/app products (E13, E14). This matches the strategic fit test's own fail signal directly: "no advantage over rivals that we can name and prove." | E8, E13, E14 |
| Capability and risk | Not formally reached — a Fail on right-to-win already parks the candidate per the playbook's rule — but worth recording: this would need new device-integration and smart-meter-penetration capability with no evidenced build or partner path, which would likely also fail this question independently. | — |

**Result: Fails strategic fit on right-to-win.**

## Sizing (produced anyway, per this run's instruction to fully analyze every opportunity, not stop at the strategic fit fail)

| Input | Value used | Basis |
| --- | --- | --- |
| Households on a flexible/market-price tariff | 200,000-300,000 accounts | **Assumption** — most of the base is now market-price-exposed by default since universal service ended (E3); no Estonia-only Enefit figure exists, so this is bracketed, not sourced, same caveat as Candidate 1's H1.1. |
| Adoption of an automated optimizer add-on | 3% (conservative) / 6% (base) / 12% (optimistic) | **Assumption** — set lower than Candidate 1's adoption range because this requires new hardware/app engagement and behavior change, not just picking a different bill structure — a higher-friction ask. |
| Value per adopting customer per year | €15 (conservative) / €30 (base) / €50 (optimistic) | **Assumption** — small optimizer add-on fee/margin, no market pricing data available. |

**Sized prize (conservative / base / optimistic):**

- Conservative: 200,000 × 3% × €15 = **€90,000/year** — misses the minimum prize.
- Base: 250,000 × 6% × €30 = **€450,000/year** — misses the minimum prize.
- Optimistic: 300,000 × 12% × €50 = **€1,800,000/year** — clears the minimum prize.

Base case misses the €500,000/year minimum prize, unlike Candidate 1. Only the optimistic case clears it.

## Indirect value

Possible churn reduction from a "stickier," more engaged customer relationship (an app used daily is a stronger retention lever than a passive electricity contract) — plausible but unquantifiable without usage data this run lacks. Logged as hypothesis H2.4.

## Cannibalization check

This candidate has an unusual structural tension worth flagging explicitly: by design, it helps customers *reduce* their bill by shifting consumption to cheaper hours, which — unless the fee/subscription margin more than offsets it — works against Enefit's own energy-margin revenue from that customer. This is a real, structural risk this candidate carries that Candidate 1 does not: 1 monetizes a *pricing structure* choice, while 2 monetizes *helping the customer spend less*, which needs the add-on fee to outrun the margin it gives away. Logged as hypothesis H2.5.

## Hypotheses raised

| ID | Type | Statement | Risk (1-5) | Uncertainty (1-5) | Status | Evidence |
| --- | --- | --- | --- | --- | --- | --- |
| H2.1 | Desirability | We believe flexible-tariff customers want automated load-shifting because doing it manually is tedious. We will know we are right when opt-in and sustained usage clear the base-case adoption rate. | 4 | 5 | Untested | E13, E14 |
| H2.2 | Strategic | We believe this fits an Enefit flexibility/energy-transition priority, but no internal brief confirms it. | 3 | 5 | Untested (unclear at strategic fit) | — |
| H2.3 | Feasibility | We believe Enefit could build or partner its way to a competitive automated-response feature within a reasonable timeframe, despite having none evidenced today. | 4 | 4 | Untested — this is the hypothesis that would need to flip to revisit the right-to-win Fail | E8 |
| H2.4 | Viability | We believe this drives retention/stickiness beyond what the fee alone captures, but this cannot be measured without usage data this run lacks. | 3 | 5 | Untested — needs internal data access | — |
| H2.5 | Viability | We believe the add-on fee/margin exceeds the energy-margin given up by helping customers shift to cheaper consumption; this is not resolved by desk research. | 4 | 4 | Untested | — |

## Gate proposal (this candidate individually)

**Kill.** Two independent reasons, either one of which would be enough on its own: (1) it fails the strategic fit test's right-to-win question outright — two Baltic-adjacent competitors already have a live product and Enefit has no evidenced capability or plan here (H2.3); (2) even setting that aside, the economics are weak on their own terms — the base case (€450,000/year) misses the minimum prize, and the structural tension between the optimizer's savings and Enefit's own energy margin (H2.5) makes the sizing here less trustworthy than Candidate 1's, not more. Not carried to Stage 2.

# Stage 1 case file — Candidate 3: Solar-and-storage subscription bundle

**Current stage:** 1 — Opportunity framing (sizing complete, awaiting gate approval)
**Owner:** Jüri Tomingas (homework run — standing in as named business approver, per `../scope.md`)

## Problem statement

"Estonian homeowners who want to cut their electricity bill with solar and storage struggle to do so because the upfront hardware and installation cost is a large lump sum with financing friction; today they either self-fund a solar-only install, delay indefinitely, or don't consider it at all." (H3.1)

## Segment

Estonian B2C households with a suitable roof/site who have not yet installed solar or storage — intentionally not narrowed to a specific housing type (e.g. detached houses only) at this stage, per `../scope.md`'s open-segment instruction, though the underlying evidence (E6, E9) mostly concerns single-family homes, so Stage 2 should confirm whether the segment is narrower than "all households" in practice.

## Why now

Microproducer connections on the Elektrilevi network have grown substantially — 22,825 connected producers as of Q1 2025, 13,455 of them microproducers, with 353 new connections added in that quarter alone, and solar capacity up roughly 8x over five years (E6). That is real, growing adoption, but it is still a small share of Estonia's total household base, meaning most of the addressable market has not yet installed solar — the barrier is not disinterest but the up-front capital and financing friction (E9, E10).

## Strategic fit result (from `../opportunities.md`)

Pass on right to win (Eesti Energia's own utility-scale battery storage at Auvere and its Enefit Green renewables arm, E16, plus Enefit's existing small-producer package, E5). Unclear on strategic priority and on capability/risk — specifically, the capital intensity of a hardware-and-financing product is flagged by `../scope.md`'s own Pilot-cost table as a hold/kill signal above ~€50,000 without an external financing/leasing partner, and no such partner is evidenced in this pass (H3.4).

## Sizing

**Every input below is either cited to an evidence ID or explicitly labeled an assumption.**

| Input | Value used | Basis |
| --- | --- | --- |
| New solar+storage subscriptions per year | 500 (conservative) / 1,000 (base) / 2,000 (optimistic) | **Assumption** — E6 shows ~300-400 new microproducer connections *per quarter* network-wide across all installers and financing methods; this range assumes Enefit's own subscription product captures a modest slice of a market that size, not that it creates the whole market. |
| Net contribution margin per customer per year (subscription/financed model, not full hardware revenue) | €300 (conservative) / €500 (base) / €800 (optimistic) | **Assumption** — no Enefit or market subscription-pricing data found; range reflects a financed-hardware-as-a-service margin, not the full equipment price, consistent with `../scope.md`'s note that this is a hardware-and-financing profile, not a software-margin one. |

**Sized prize (conservative / base / optimistic):**

- Conservative: 500 × €300 = **€150,000/year** — misses the €500,000/year minimum prize.
- Base: 1,000 × €500 = **€500,000/year** — exactly clears the minimum prize.
- Optimistic: 2,000 × €800 = **€1,600,000/year** — clears the minimum prize with margin.

This is a materially thinner margin over the minimum prize than Candidate 1: the base case only just clears the bar, and the conservative case misses it outright, which is consistent with (though independently re-derived from, not copied from) the disposition the previous, now-deleted pass reached for a similar candidate.

## Indirect value (separate from fees)

Possible brand/positioning value as part of Enefit's renewables transition story, and possible acquisition-cost savings if solar/storage customers are less likely to switch supplier once hardware is financed through Enefit. Neither is quantifiable without real data; logged as hypothesis H3.5, not included in the sized prize above.

## Cannibalization check

A solar+storage customer consumes less grid electricity from Enefit by design (that is the point of the product), so this directly reduces Enefit's own core electricity-sales revenue from that household even as it creates a new subscription/margin line. The net effect depends on whether the subscription margin exceeds the lost consumption margin per customer — this is not resolved by desk research and needs an explicit unit-economics model at Stage 3/4, not just at the pilot. Flagged as the key open question for this candidate (H3.6).

## Hypotheses raised (seed register for this candidate)

| ID | Type | Statement | Risk (1-5) | Uncertainty (1-5) | Status | Evidence |
| --- | --- | --- | --- | --- | --- | --- |
| H3.1 | Desirability | We believe homeowners without solar today are blocked mainly by upfront cost/financing, not by lack of interest. We will know we are right when a financed offer converts meaningfully better than a self-fund-only offer in a Stage 4 test. | 4 | 4 | Untested | E9, E10 |
| H3.2 | Feasibility | We believe Enefit's existing small-producer/net-metering package (E5) is a workable operational base to extend into a subscription/financing product, not a rebuild from scratch. | 3 | 3 | Untested | E5 |
| H3.3 | Strategic | We believe this fits a renewables/energy-transition priority for a state-owned energy group, but no internal brief confirms it in this homework run. | 3 | 5 | Untested (unclear at strategic fit) | E16 |
| H3.4 | Feasibility | We believe a viable financing/leasing partner for the hardware exists or can be secured; without one, `../scope.md`'s own pilot-cost guidance treats this as a hold/kill signal before Stage 5. | 5 | 5 | Untested — the single highest-risk unresolved input for this candidate | — (assumption, no source) |
| H3.5 | Viability | We believe solar/storage customers churn less once hardware is financed through Enefit, but this cannot be measured without churn data this run lacks. | 3 | 5 | Untested — needs internal data access | — |
| H3.6 | Viability | We believe the subscription/financing margin per customer exceeds the grid-electricity margin lost to self-consumption, but this is not resolved by desk research alone. | 4 | 4 | Untested | — (needs unit-economics model) |

## Gate proposal (this candidate individually)

**Pivot or hold**, per the playbook's Stage 1 gate rule: the prize depends on one unverified input — a financing/leasing partner for the hardware (H3.4) — without which the capital-intensity guidance in `../scope.md` treats this as a hold/kill signal well before Stage 5, and the base case only just clears the minimum prize while the conservative case misses it outright. Named open input to resolve before any further spend: confirm whether a financing/leasing partner is available or realistic, and get a real unit-economics read on H3.6 (subscription margin vs. lost grid-consumption margin) before committing discovery budget here ahead of Candidate 1.
